# Explicit 274bot workspace crate-graph policy.
#
# The checker derives the actual graph from Cargo.toml manifests (including
# workspace aliases, optional/dev/build/target tables, and package renames).
# Permanent allowances are the accepted destination matrix. Named migration
# records are exact remaining debt, not permanent permissions. Both are
# protected rules in this operator-owned repository.
schema_version = 1

[workspace]
members = [
    "api",
    "e2e",
    "frontend-core",
    "host",
    "host-play",
    "nav",
    "nav-executor",
    "panel",
    "scenario",
    # Dev-only executable seat model (contract §27 §8); depends on no workspace crate.
    "seat-model",
    "script",
    "tui",
    "vault",
]
# Path/workspace packages that participate in ownership but are not members
# of this Cargo workspace. crates.io and other externals are ignored.
externals = ["client"]

# Each label is bound to one canonical manifest, never just a package name.
# All listed manifests are scanned, including non-member dependency tables.
[workspace.path_packages]
client = "vendor/fr-client-rust/crates/client/Cargo.toml"
client-play = "vendor/fr-client-rust/crates/client-play/Cargo.toml"
dear-imgui-wgpu = "vendor/dear-imgui-wgpu-0.15.1/Cargo.toml"

# The only [patch.*] and [replace] entries the product root Cargo.toml may
# carry, by package name and path. A root patch makes a local package
# reachable from every external crate. An external manifest could then
# carry a crate edge or a feature request into that package, and the
# checker never reads external manifests. Any other root patch or
# replacement is refused until an operator commit adds it here.
[root_patches]
dear-imgui-wgpu = "vendor/dear-imgui-wgpu-0.15.1"

[[allow]]
from = "client-play"
to = "client"
kinds = ["normal"]
reason = "The vendored client-play executable consumes its own vendored client library."

[[allow]]
from = "panel"
to = "dear-imgui-wgpu"
kinds = ["normal"]
reason = "Panel uses the checked-in dear-imgui-wgpu backend through the crates.io path patch."

# --- leaves and host-facing types ---

[[allow]]
from = "api"
to = "client"
kinds = ["normal"]
reason = "api is the host-facing map onto the vendored client lib (Driver, snapshot types). This is intentional, not a reverse client→api edge."

[[allow]]
from = "host"
to = "api"
kinds = ["normal", "dev"]
reason = "host owns native slot/tick APIs and consumes the read/act/settle surface. dev-only: api test-support (the test-only raw packet sink `Out` that recording test drivers use, SERVER-ORDERED-S2); api test-support is never enabled in the normal graph."

[[allow]]
from = "host"
to = "client"
kinds = ["normal", "dev"]
reason = "host drives one Client per slot; rendering stays in the client, not in host. dev-only: real WebSocket test connector under client test-support for the idle WSS park regression; client test-support is never enabled in the normal graph."

[[allow]]
from = "host"
to = "vault"
kinds = ["normal"]
reason = "host reads vaulted credentials/assignments; vault stays a leaf store."

[[allow]]
from = "nav"
to = "api"
kinds = ["normal"]
reason = "nav execute uses host-facing types; it does not own panel/script lifecycle."

[[allow]]
from = "nav"
to = "client"
kinds = ["normal"]
reason = "nav bake/collision reads packed client world data."

[[allow]]
from = "nav-executor"
to = "api"
kinds = ["normal", "dev"]
reason = "The walk executor sends through api::interact and settles through api::settle over the host's GameSnapshot. It owns the per-slot Traveller state. It plans nothing. dev-only: api test-support (the test-only raw packet sink `Out` that recording test drivers use, SERVER-ORDERED-S2); api test-support is never enabled in the normal graph."

[[allow]]
from = "nav-executor"
to = "nav"
kinds = ["normal", "dev"]
reason = "The executor follows planner plans and reads transport facts, world state, quest evidence and the essence session through lists A and C of NAV-CRATE-SPLIT design-r3 2.4 (Route, Leg, CompactRouteLeg, RoutePlanLease, TransportEdge, TransportKind, DoorDir, WorldState, QuestEvidence, QuestGates, the essence items, and the raw forwarding module executor_adapter), enforced by the executor's own source test. The planner never depends on the executor. The script facade (contract) is unchanged by the split. dev: list B through the planner's test-support feature (test_support fixture builders, StepGrid fixtures, find_on_grid, NavWorld::load_default_pack_or_skip)."

[[allow]]
from = "nav-executor"
to = "client"
kinds = ["normal"]
reason = "Scene collision flag bits (client::dash3d::CollisionFlag) for approach-stand selection (snapshot.rs scene_standable, npc_hop.rs cardinal_stand), and the real Client driver in the executor's tests. api uses the type internally and does not re-export it. A later api::query helper may remove this edge."

# --- script kernel ---

[[allow]]
from = "script"
to = "api"
kinds = ["normal", "dev"]
reason = "compiled cards and isolate bindings sit on the Rust API surface. dev-only: api test-support (the test-only raw packet sink `Out` that recording test drivers use, SERVER-ORDERED-S2); api test-support is never enabled in the normal graph."

[[allow]]
from = "script"
to = "vault"
kinds = ["normal"]
reason = "script persists assignment/settings through the vault bag."

[[allow]]
from = "script"
to = "client"
kinds = ["dev"]
reason = "dev-only: ctx unit tests build client ObjType tables. The compiled script crate must stay client-free."

[[allow]]
from = "script"
to = "seat-model"
kinds = ["dev"]
reason = "Main 2026-10-12, F0-SCRIPT-SEAM conformance oracle, §27 §2.2 / ADR 0008"

[[allow]]
from = "script"
to = "nav"
kinds = ["normal"]
reason = "Permanent script -> nav edge. F0 freezes nav::contract semantics; T5.1 removes exact production representation exceptions without removing this edge."

# --- orchestration and composition ---

[[allow]]
from = "host-play"
to = "api"
kinds = ["normal", "dev"]
reason = "shared Play session exposes host-facing snapshot/interact types to operator fronts. dev-only: api test-support (the test-only raw packet sink `Out` that recording test drivers use, SERVER-ORDERED-S2); api test-support is never enabled in the normal graph."

[[allow]]
from = "host-play"
to = "client"
kinds = ["normal"]
reason = "Play constructs and pumps Client slots; it does not own GPU/UI."

[[allow]]
from = "host-play"
to = "host"
kinds = ["normal"]
reason = "Play is the lifecycle owner over host slots (login FIFO, tick, park)."

[[allow]]
from = "host-play"
to = "nav"
kinds = ["normal", "build"]
reason = "Play drives Traveller/WalkTo; the build script bakes/stages the selected revision nav identity."

[[allow]]
from = "host-play"
to = "nav-executor"
kinds = ["normal"]
reason = "Play owns the per-slot Traveller (NavBot for script walks, WalkArm for manual WalkTo) and polls Traveller::follow one step per tick. host-play's own tests and live tests construct a Traveller. host-play's test-support feature exposes WalkArm::with_latched_essence so frontend tests never name the executor."

[[allow]]
from = "host-play"
to = "script"
kinds = ["normal", "dev"]
reason = "Play owns the per-slot script transaction (start/pause/stop/load) as one cohesive unit. dev: host-play's own tests install native fixtures through script's test-hooks seams (start_test_script, prepare_for_test); production builds never enable them."

[[allow]]
from = "host-play"
to = "vault"
kinds = ["normal"]
reason = "Play unlocks the vault and assigns profiles to slots."

[[allow]]
from = "host-play"
to = "scenario"
kinds = ["optional", "dev"]
reason = "optional: scenario runner is feature-gated (memory-profile / live harness), not a default host-play edge. dev: host-play's offline and LIVE test cells drive the shared ScenarioRunner without a feature flag; production builds still need the feature."

[[allow]]
from = "scenario"
to = "api"
kinds = ["normal"]
reason = "headed/headless scenarios drive the host-facing API, not panel internals."

[[allow]]
from = "scenario"
to = "client"
kinds = ["normal"]
reason = "scenarios observe client scene/login facts for live gates."

[[allow]]
from = "scenario"
to = "nav"
kinds = ["normal"]
reason = "nav-family scenarios share the packed world/router, not script isolate internals."

[[allow]]
from = "scenario"
to = "nav-executor"
kinds = ["normal"]
reason = "nav-family scenarios drive Traveller::follow over a real Client. scenario never starts or hosts a script."

[[allow]]
from = "scenario"
to = "script"
kinds = ["normal"]
reason = "Path-backed Quester fixtures reuse script's Path document model and registry with default-features = false (no V8); scenario never starts or hosts a script."

# --- shared operator lifecycle ---

[[allow]]
from = "frontend-core"
to = "host-play"
kinds = ["normal", "dev"]
reason = "frontend-core owns the operator lifecycle above Play (vault, fleet, selection, removals, operation results); host-play stays authoritative for workers, login queue and script execution. dev: test-support Play fixtures."

[[allow]]
from = "frontend-core"
to = "api"
kinds = ["normal"]
reason = "the structured operator log is the api::hostlog sink; it uses the facade's Level/Source/Record vocabulary and nothing else from api."

[[allow]]
from = "frontend-core"
to = "host"
kinds = ["normal"]
reason = "the slot surface hands host SlotInput/FrameBuf handles to Play::try_spawn_slot; no host API is called directly."

[[allow]]
from = "frontend-core"
to = "script"
kinds = ["normal"]
reason = "script Start/Pause/Stop settlement uses the kernel's run-state and start-outcome types."

[[allow]]
from = "frontend-core"
to = "vault"
kinds = ["normal"]
reason = "the core owns the unlocked vault and profile setting writes for both front ends."

[[allow]]
from = "frontend-core"
to = "nav"
kinds = ["normal"]
reason = "group walk and the durable walk permissions name the nav vocabulary Play's API already exposes (FindOptions, Tile, WorldState); the 0.2.1 move of panel's WalkTo/nav chrome into frontend-core widens this, never the reverse."

[[allow]]
from = "frontend-core"
to = "client"
kinds = ["dev"]
reason = "dev-only: lifecycle tests drive a real Client through Play::run_with_io hooks (logout packet, frame capture) and build nav collision fixtures. Production frontend-core must stay client-free."

[[allow]]
from = "frontend-core"
to = "scenario"
kinds = ["dev", "optional"]
reason = "dev: the blocked-stop LIVE cell runs the shared ScenarioRunner against the shared panel/TUI presentation. optional: frontend-core's live-harness feature (Main, T3.3 r2 D2, 2026-10-18) hosts the --live/--smoke harness that panel and TUI reached directly before T3.3; product builds without live-harness have no scenario in their graph."

[[allow]]
from = "panel"
to = "frontend-core"
kinds = ["normal", "dev"]
reason = "panel is the native adapter over the shared operator session. dev: arm-only spawn fixtures."

[[allow]]
from = "tui"
to = "frontend-core"
kinds = ["normal", "dev"]
reason = "tui is the headless adapter over the shared operator session. dev: arm-only spawn fixtures."

[[allow]]
from = "panel"
to = "api"
kinds = ["normal"]
reason = "panel UI binds host-facing types; it does not reimplement the client applet UI."

[[allow]]
from = "panel"
to = "client"
kinds = ["normal"]
reason = "panel blits the client frame and feeds input; GPU 3D stays in the client."

[[allow]]
from = "panel"
to = "host-play"
kinds = ["dev"]
reason = "Test-only live-probe feature for panel manual-click LIVE cells."

[[allow]]
from = "panel"
to = "nav"
kinds = ["normal"]
reason = "WalkTo picker and nav paints are panel chrome over host nav."

[[allow]]
from = "tui"
to = "api"
kinds = ["normal", "dev"]
reason = "tui-play is the headless composition front over the same API surface. dev-only: api test-support (the test-only raw packet sink `Out` that recording test drivers use, SERVER-ORDERED-S2); api test-support is never enabled in the normal graph."

[[allow]]
from = "tui"
to = "client"
kinds = ["normal"]
reason = "tui observes client facts with raster Off; it does not own a GPU loop."

[[allow]]
from = "tui"
to = "host-play"
kinds = ["dev"]
reason = "Test-only test-support and live-probe fixtures; never production permission."

[[allow]]
from = "tui"
to = "nav"
kinds = ["normal"]
reason = "tui map pane reads packed collision/pins."

[[allow]]
from = "tui"
to = "host"
kinds = ["dev"]
reason = "dev-only: tui tests construct host types. Production tui must keep going through host-play."

# --- test orchestration (not production ownership) ---

[[allow]]
from = "e2e"
to = "api"
kinds = ["normal"]
reason = "e2e is wide test orchestration over host-facing types, not a product UI crate."

[[allow]]
from = "e2e"
to = "client"
kinds = ["normal"]
reason = "headless twins observe client scene/login facts."

[[allow]]
from = "e2e"
to = "host"
kinds = ["normal"]
reason = "e2e links host to poll slot state instead of scraping logs."

[[allow]]
from = "e2e"
to = "host-play"
kinds = ["normal", "dev"]
reason = "e2e reuses Play for login/RSS/null-raster twins and suite child launch. dev: test-support so script's unprotected V8 test platform is compiled for libtest workers; production e2e-suite binaries never enable it."

[[allow]]
from = "e2e"
to = "nav"
kinds = ["normal"]
reason = "nav-family live twins share packed world/router."

[[allow]]
from = "e2e"
to = "scenario"
kinds = ["normal"]
reason = "headed/headless scenario twins share the scenario runner."

[[allow]]
from = "e2e"
to = "vault"
kinds = ["normal"]
reason = "live twins mint/unlock vaulted profiles."

# All rows inspect the union of target cfgs. Provenance retains the exact cfg.
# These are source/activation gates, not invocations of candidate build scripts.
[[configuration]]
id = "full-products"
packages = ["panel", "tui", "host-play"]
features = []
default_features = true
dev = false
status = "enforced"
owner = "T1"
forbidden_features = []
optional_dependencies = []

[[configuration]]
id = "workspace-tests"
packages = ["api", "e2e", "frontend-core", "host", "host-play", "nav", "nav-executor", "panel", "scenario", "script", "seat-model", "tui", "vault"]
features = []
default_features = true
dev = true
status = "enforced"
owner = "T1"
forbidden_features = []
optional_dependencies = []

[[configuration]]
id = "script-no-default"
packages = ["script"]
features = []
default_features = false
dev = false
status = "enforced"
owner = "T2"
forbidden_features = ["script/load"]
optional_dependencies = []

[[configuration]]
id = "script-load-tests"
packages = ["script"]
features = ["script/load"]
default_features = true
dev = true
status = "enforced"
owner = "T2"
forbidden_features = []
optional_dependencies = []

[[configuration]]
id = "memory-profile"
packages = ["panel", "tui", "host-play"]
features = ["panel/memory-profile", "tui/memory-profile", "host-play/memory-profile"]
default_features = true
dev = false
status = "enforced"
owner = "T1"
forbidden_features = []
optional_dependencies = []

[[configuration]]
id = "memory-profile-no-alloc"
packages = ["panel", "tui", "host-play"]
features = ["panel/memory-profile-no-alloc", "tui/memory-profile-no-alloc", "host-play/memory-profile-no-alloc"]
default_features = true
dev = false
status = "enforced"
owner = "T1"
forbidden_features = []
optional_dependencies = []

[[configuration]]
id = "host-performance"
packages = ["host"]
features = ["host/performance-profile"]
default_features = true
dev = true
status = "enforced"
owner = "T1"
forbidden_features = []
optional_dependencies = []

[[configuration]]
id = "render-diagnostics"
packages = ["panel", "host"]
features = ["panel/render-diagnostics", "host/render-diagnostics"]
default_features = true
dev = true
status = "enforced"
owner = "T4"
forbidden_features = []
