# Native-only policy remains pending until T2 makes deno_ast optional and
# removes script/load activation. Only an operator policy commit changes status.
[[configuration]]
id = "native-only"
packages = ["panel", "tui", "host-play"]
features = []
default_features = false
dev = false
status = "pending"
owner = "T2"
forbidden_features = ["script/load"]
optional_dependencies = ["script/deno_ast"]
